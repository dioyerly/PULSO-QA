function coverageTable(r){return `<div class="tablewrap"><table><thead><tr><th>Área</th><th>Alcance</th><th>Checks registrados</th><th>Manual ejecutado</th></tr></thead><tbody>${coverage(r).map(c=>`<tr><td>${esc(c.category)}</td><td>${badge(c.status)}</td><td>${c.checks}</td><td>${c.done} / ${c.cases}</td></tr>`).join('')}</tbody></table></div><p class="compact muted">Tested = casos sugeridos ejecutados (PASS/FAIL); Partial = revisión estática con comprobaciones; Manual Required = falta verificación de comportamiento; Not Applicable = no se detectó una característica aplicable. No certifica cobertura exhaustiva.</p>`}
function dashboard(){const r=active(),m=metrics(r);return pagehead('Dashboard','Control de calidad local. Evidencia antes que suposiciones.',`<button data-action="demo">Load Demo Project</button><button class="primary" data-nav="new">+ Nuevo Test</button>`)+summaryStats(r)+(r?`<div class="panel statusband"><div><span class="eyebrow">QA STATUS · ANÁLISIS SELECCIONADO</span><div class="statusbig">${esc(m.status)}</div><span class="muted">${esc(r.product)}</span></div><div><strong>${r.issues.length} hallazgos</strong> · ${m.manualPending} casos manuales pendientes<br><span class="muted compact">La ausencia de fallos estáticos no demuestra que el producto funcione.</span></div><button data-nav="report">Ver reporte →</button></div><div class="two"><section class="panel"><h2>Test Coverage</h2>${coverageTable(r)}</section><section class="panel"><h2>Revisión prioritaria</h2>${issueTable(r,r.issues.filter(i=>!['Fixed',"Won't Fix"].includes(i.status)).sort((a,b)=>severities.indexOf(a.severity)-severities.indexOf(b.severity)).slice(0,6),true)}<div class="note">AUTO: operación ejecutada por PULSO. STATIC: revisión de código, sin ejecutar el producto. MANUAL: resultado registrado por el tester.</div><button data-nav="runner">Continuar Test Runner</button></section></div>`:empty())}
function newTest(){return pagehead('Nuevo Test','Inspección segura de HTML, microapps, dashboards y ebooks interactivos.')+`<div class="panel"><div id="drop" class="drop"><div class="eyebrow">INPUT / HTML DOCUMENT</div><h2>Arrastrá tu archivo HTML</h2><div class="muted">.html o .htm · hasta 8 MB · el código cargado no se ejecuta</div><input type="file" id="htmlFile" accept=".html,.htm,text/html" aria-label="Seleccionar archivo HTML"></div><div class="note">El análisis utiliza un documento inerte y no descarga recursos. Las funciones que requieran ejecución se registran como <strong>No verificable automáticamente</strong>.</div><label class="field"><span>Nombre del producto (opcional)</span><input id="productName" maxlength="300" value="${esc(staged?.product||state.settings.product)}" placeholder="Se utilizará el título del HTML o el nombre del archivo"></label>${staged?`<div class="panel"><h2>Archivo listo</h2><dl><dt>Nombre</dt><dd>${esc(staged.file.name)}</dd><dt>Tamaño / tipo</dt><dd>${bytes(staged.file.size)} · ${esc(staged.file.type||'text/html (por extensión)')}</dd><dt>Fecha de análisis</dt><dd>Se registrará al iniciar QA</dd><dt>Elementos aprox.</dt><dd>${staged.preview.elements}</dd><dt>Scripts / estilos</dt><dd>${staged.preview.scripts} / ${staged.preview.styles}</dd><dt>Recursos externos</dt><dd>${staged.preview.external} (sin descargar)</dd></dl></div>`:''}<button class="primary" id="startQA" data-action="analyze" ${!staged||busy?'disabled':''}>${busy?'ANALIZANDO…':'INICIAR QA'}</button></div>`}
function issueTable(r,list,compact=false){if(!list.length)return '<div class="empty">No hay hallazgos para mostrar.</div>';return `<div class="tablewrap"><table><thead><tr><th>ID / hallazgo</th><th>Severidad</th>${compact?'':'<th>Categoría</th><th>Modo</th><th>Estado</th>'}</tr></thead><tbody>${list.map(i=>`<tr><td><button class="linkbutton" data-action="issue" data-id="${esc(i.id)}"><span class="mono">${esc(i.id)}</span><br>${esc(i.title)}</button></td><td>${badge(i.severity)}</td>${compact?'':`<td>${esc(i.category)}</td><td>${badge(i.mode)}</td><td>${esc(i.status)}</td>`}</tr>`).join('')}</tbody></table></div>`}
function filteredIssues(r){return r.issues.filter(i=>(!filters.severity||i.severity===filters.severity)&&(!filters.category||i.category===filters.category)&&(!filters.status||i.status===filters.status)&&(!filters.mode||i.mode===filters.mode)&&(!filters.search||[i.id,i.title,i.description,i.element].join(' ').toLowerCase().includes(filters.search.toLowerCase())))}
function issues(){const r=active();return pagehead('Issues','Hallazgos trazables al código y a los resultados manuales.')+(r?`<div class="panel"><div class="filters"><input id="issueSearch" type="search" placeholder="Buscar ID, texto o elemento…" aria-label="Buscar issues" value="${esc(filters.search)}"><select data-filter="severity" aria-label="Filtrar severidad">${options(severities,filters.severity,'All severities')}</select><select data-filter="category" aria-label="Filtrar categoría">${options(areas,filters.category,'Todas las categorías')}</select><select data-filter="status" aria-label="Filtrar estado">${options(issueStatuses,filters.status,'Todos los estados')}</select><select data-filter="mode" aria-label="Filtrar modo">${options(modes,filters.mode,'AUTO / STATIC / MANUAL')}</select><button data-action="resetFilters">Limpiar</button></div><div id="issueResults">${issueTable(r,filteredIssues(r))}</div></div>`:empty())}
function manualCases(r){return r.cases.map(c=>`<details class="case" id="case-${esc(c.id)}"><summary><span class="mono">${esc(c.id)}</span><strong>${esc(c.title)}</strong>${badge(c.result,c.result==='NOT TESTED'?'NV':c.result)}</summary><div class="kvs"><span>${badge('MANUAL')}</span><span>${esc(c.category)}</span></div><p><strong>Precondición:</strong> ${esc(c.precondition)}</p><ol class="steps">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><strong>Esperado:</strong> ${esc(c.expected)}</p><label class="field"><span>Resultado</span><select data-case-result="${esc(c.id)}">${options(results,c.result)}</select></label><label class="field"><span>Notas / resultado observado</span><textarea data-case-notes="${esc(c.id)}" maxlength="100000" placeholder="Entorno, pasos y resultado real…">${esc(c.notes)}</textarea></label><div class="actions"><button data-action="caseEvidence" data-id="${esc(c.id)}">Add Screenshot</button>${c.result==='FAIL'?`<button data-action="caseBug" data-id="${esc(c.id)}">${c.bugId?'Abrir '+esc(c.bugId):'Convertir FAIL en BUG'}</button>`:''}</div>${evidenceCards(r,r.evidence.filter(e=>e.caseId===c.id))}</details>`).join('')}
function runner(catalog=false){const r=active();return pagehead(catalog?'Casos de prueba':'Test Runner',catalog?'Catálogo reproducible de comprobaciones y casos sugeridos.':'Ejecutá el producto por separado y registrá el resultado observado.')+(r?`<div class="panel"><div class="kvs"><span><strong>${r.checks.filter(c=>c.mode==='AUTO').length}</strong>AUTO · operaciones PULSO</span><span><strong>${r.checks.filter(c=>c.mode==='STATIC').length}</strong>STATIC · checks e indicios</span><span><strong>${r.cases.length}</strong>MANUAL · casos sugeridos</span><span><strong>${metrics(r).manualPending}</strong>Pendientes / bloqueados</span></div><div class="note">No se ejecutan clics, scripts ni workflows del producto. <strong>Requires Runtime Test</strong> significa que falta comprobar el comportamiento. PASS/FAIL manuales son declaraciones del tester.</div></div>${catalog?`<section class="panel"><h2>Comprobaciones automáticas y estáticas</h2><div class="tablewrap"><table><thead><tr><th>ID</th><th>Área / comprobación</th><th>Modo</th><th>Resultado</th><th>Evidencia</th></tr></thead><tbody>${r.checks.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.category)}<br><strong>${esc(c.title)}</strong></td><td>${badge(c.mode)}</td><td>${badge(c.status)}</td><td class="break">${esc(c.detail)}</td></tr>`).join('')}</tbody></table></div></section>`:''}<section class="panel"><h2>Manual Test Runner</h2>${manualCases(r)}</section>`:empty())}
function evidenceCards(r,list){return list.length?`<div class="evidencegrid">${list.map(e=>`<article class="evidence"><button class="linkbutton" data-action="viewEvidence" data-id="${esc(e.id)}" aria-label="Abrir ${esc(e.name)}"><img src="${esc(e.data)}" alt="${esc(e.description||e.name)}" loading="lazy"></button><div class="body"><strong class="break">${esc(e.description||e.name)}</strong><p class="compact muted">${esc(date(e.date))}</p><p class="compact">${esc(e.bugId||'Sin bug asociado')}${e.caseId?' · '+esc(e.caseId):''}</p><p class="compact">${esc(e.notes)}</p><button class="danger" data-action="deleteEvidence" data-id="${esc(e.id)}">Eliminar captura</button></div></article>`).join('')}</div>`:''}
function evidence(){const r=active();return pagehead('Evidencias','Capturas locales vinculadas a bugs y casos de prueba.')+(r?`<div class="panel"><form id="evidenceForm"><div class="two"><div><label class="field"><span>Screenshot PNG / JPG / JPEG · hasta 6 MB</span><input name="image" id="imageInput" type="file" accept="image/png,image/jpeg" required></label><img id="imagePreview" alt="Vista previa de la captura seleccionada" hidden style="max-width:100%;max-height:180px"><label class="field"><span>Descripción</span><input name="description" maxlength="1000" required placeholder="Qué demuestra esta captura"></label></div><div><label class="field"><span>Bug relacionado</span><select name="bugId" id="evidenceBug">${options(r.issues.map(i=>i.id),'','Sin bug asociado')}</select></label><label class="field"><span>Caso relacionado</span><select name="caseId" id="evidenceCase">${options(r.cases.map(c=>c.id),'','Sin caso asociado')}</select></label><label class="field"><span>Observaciones</span><textarea name="notes" maxlength="100000"></textarea></label></div></div><button class="primary" type="submit">Guardar evidencia</button><p class="compact muted">La fecha se registra al guardar. Ninguna captura se sube a Internet.</p></form></div><div class="panel"><h2>${r.evidence.length} capturas guardadas</h2>${evidenceCards(r,r.evidence)||'<p class="muted">Todavía no hay capturas en este análisis.</p>'}</div>`:empty())}
function dependencyTable(r){return r.dependencies.length?`<div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Ubicación</th><th>Recurso / origen</th></tr></thead><tbody>${r.dependencies.map(d=>`<tr><td>${esc(d.type)}</td><td>${esc(d.scope)}</td><td class="break"><code>${esc(d.url)}</code><br>${esc(d.origin)}</td></tr>`).join('')}</tbody></table></div>`:'<p>No se identificaron dependencias estáticas. Esto no demuestra funcionamiento offline.</p>'}
class ReportManager{
 static html(r){const m=metrics(r);return `<article class="report"><div class="reporttitle"><div class="eyebrow">PULSO QA / QA TEST REPORT</div><h1>${esc(r.product)}</h1><p class="muted">${esc(r.file.name)} · ${esc(date(r.date))}</p></div><dl><dt>Product / File</dt><dd>${esc(r.product)} / ${esc(r.file.name)}</dd><dt>Test date</dt><dd>${esc(date(r.date))}</dd><dt>Test duration</dt><dd>${r.duration} ms (motor estático; no incluye ejecución manual)</dd><dt>Tester</dt><dd>${esc(state.settings.tester||'No indicado')}</dd><dt>QA Status</dt><dd><strong>${esc(m.status)}</strong></dd><dt>Tests executed</dt><dd>${m.executed} comprobaciones concluyentes/riesgos y casos manuales: ${r.checks.filter(c=>c.mode==='AUTO'&&['PASS','FAIL','WARNING'].includes(c.status)).length} AUTO; ${r.checks.filter(c=>c.mode==='STATIC'&&['PASS','FAIL','WARNING'].includes(c.status)).length} STATIC; ${r.cases.filter(c=>['PASS','FAIL'].includes(c.result)).length} MANUAL. No equivale a funciones del producto ejecutadas.</dd><dt>Passed / Failed</dt><dd>${m.passed} / ${m.failed}</dd><dt>Warnings / Critical</dt><dd>${m.warnings} / ${m.critical}</dd><dt>Manual pending</dt><dd>${m.manualPending} (incluye BLOCKED)</dd><dt>Not Verifiable</dt><dd>${m.nv} comprobaciones no verificables automáticamente</dd></dl><section class="reportsection"><h2>Executive Summary</h2><p>Se inspeccionó el archivo local mediante análisis estático y se registraron ${r.issues.length} hallazgos, ${r.cases.length} casos manuales sugeridos y ${r.evidence.length} capturas. ${m.failed?'Hay comprobaciones fallidas que requieren revisión.':'No se registraron comprobaciones fallidas en el alcance evaluado.'} ${m.manualPending?'La evaluación funcional sigue incompleta.':''}</p><div class="note">AUTO = operación real de PULSO; STATIC = inspección de código; MANUAL = resultado declarado por el tester. No se ejecutaron scripts del producto. FAIL estático expresa una condición de código incumplida, no necesariamente un fallo funcional. Cambiar un issue a Fixed no reescribe resultados: se necesita un nuevo análisis o retest.</div></section><section class="reportsection"><h2>Test Coverage · ${m.coverage}% manual</h2><p>Porcentaje = casos manuales marcados PASS o FAIL (${r.cases.filter(c=>['PASS','FAIL'].includes(c.result)).length}) / casos sugeridos (${r.cases.length}). NOT TESTED y BLOCKED no cuentan como ejecutados. No representa el porcentaje de funcionalidades cubiertas.</p>${coverageTable(r)}</section>${severities.map(s=>`<section class="reportsection"><h2>${s.charAt(0)+s.slice(1).toLowerCase()} Issues</h2>${r.issues.filter(i=>i.severity===s).map(i=>`<div class="reportissue"><strong>${esc(i.id)} · ${esc(i.title)}</strong> ${badge(i.mode)}<p>${esc(i.category)} · ${esc(i.severity)} · ${esc(i.status)}</p><p><strong>Descripción:</strong> ${esc(i.description)}</p><p><strong>Ubicación:</strong> ${esc(i.location)}</p>${i.element?`<p><strong>Elemento:</strong> <code>${esc(i.element)}</code></p>`:''}<p><strong>Esperado:</strong> ${esc(i.expected)}</p><p><strong>Encontrado:</strong> ${esc(i.actual)}</p><p><strong>Evidencia:</strong> <code>${esc(i.evidence)}</code></p><p><strong>Recomendación:</strong> ${esc(i.recommendation)}</p></div>`).join('')||'<p class="muted">Sin hallazgos de esta severidad.</p>'}</section>`).join('')}<section class="reportsection"><h2>Manual Test Results</h2>${r.cases.map(c=>`<div class="reportissue"><strong>${esc(c.id)} · ${esc(c.title)}</strong> ${badge(c.result)}<p><strong>Precondición:</strong> ${esc(c.precondition)}</p><ol>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p><strong>Esperado:</strong> ${esc(c.expected)}</p><p><strong>Notas:</strong> ${esc(c.notes||'Sin notas')}${c.bugId?' · BUG '+esc(c.bugId):''}</p></div>`).join('')}</section><section class="reportsection"><h2>Evidence</h2>${state.settings.includeEvidence?(r.evidence.length?`<div class="evidencegrid">${r.evidence.map(e=>`<div class="evidence"><img src="${esc(e.data)}" alt="${esc(e.description)}"><div class="body"><strong>${esc(e.description)}</strong><p>${esc(e.bugId||'Sin bug')} · ${esc(e.caseId||'Sin caso')} · ${esc(date(e.date))}</p><p>${esc(e.notes)}</p></div></div>`).join('')}</div>`:'<p>No se adjuntaron capturas.</p>'):`<p>${r.evidence.length} capturas omitidas del reporte por configuración; se conservan en el workspace y el backup.</p>`}</section><section class="reportsection"><h2>Offline Readiness</h2>${dependencyTable(r)}<p>No verificable automáticamente: no se descargan recursos ni se comprueba la caché, disponibilidad de red o URLs dinámicas.</p></section><section class="reportsection"><h2>Print / PDF Readiness</h2><p>@media print ${r.meta.features.print?'detectado':'no detectado'}. La paginación del producto y los PDF interactivos no se verifican en esta fase.</p></section><section class="reportsection"><h2>Recommendations</h2><ul>${Array.from(new Set(r.issues.filter(i=>!['Fixed',"Won't Fix"].includes(i.status)).map(i=>i.recommendation))).map(s=>`<li>${esc(s)}</li>`).join('')||'<li>Completar los casos manuales y conservar evidencias.</li>'}</ul></section><section class="reportsection"><h2>Technical Information</h2><p>Motor PULSO QA 1.0 · DOMParser inerte · ${bytes(r.file.size)} · ${r.meta.elements} elementos · ${r.meta.scripts} scripts · ${r.meta.styles} bloques/hojas de estilo · ${r.meta.mediaQueries} media queries reconocidas.</p><p>Heurísticas sobre scripts y estilos internos; comentarios, cadenas, HTML reparado y código dinámico pueden producir falsos positivos o negativos. Ubicaciones de línea aproximadas. Recursos externos y carpetas vecinas no inspeccionados. La revisión básica de seguridad no certifica ausencia de vulnerabilidades.</p></section><footer>PULSO QA · Automated &amp; Manual Product Testing · Reporte local generado ${esc(date(new Date().toISOString()))}</footer></article>`}
 static async print(){const r=active();if(!r)return;$('#printRoot').innerHTML=this.html(r);await Promise.all(Array.from($('#printRoot').querySelectorAll('img')).map(im=>im.decode().catch(()=>{})));window.print()}
}
function report(){return pagehead('Reporte','Resultados, alcance y evidencia para una revisión profesional.',active()?'<button class="primary" data-action="print">PRINT / SAVE AS PDF</button>':'')+(active()?`<div class="panel">${ReportManager.html(active())}</div>`:empty())}
function history(){return pagehead('Historial','Análisis guardados en este navegador y esta ubicación de archivo.')+(state.runs.length?`<div class="panel tablewrap"><table><thead><tr><th>Producto / archivo</th><th>Fecha</th><th>Resultado</th><th>Hallazgos</th><th>C / H / M / L</th><th>Acciones</th></tr></thead><tbody>${state.runs.map(r=>`<tr><td><strong>${esc(r.product)}</strong><br><span class="muted">${esc(r.file.name)}</span>${r.id===state.activeId?' '+badge('ACTIVO','PASS'):''}</td><td>${esc(date(r.date))}</td><td>${badge(metrics(r).status,metrics(r).status==='FAIL'?'FAIL':'INFO')}</td><td>${r.issues.length}</td><td>${severities.slice(0,4).map(s=>r.issues.filter(i=>i.severity===s).length).join(' / ')}</td><td><div class="actions"><button data-action="openRun" data-id="${esc(r.id)}">Abrir</button><button data-action="duplicateRun" data-id="${esc(r.id)}">Duplicar test</button><button class="danger" data-action="deleteRun" data-id="${esc(r.id)}">Eliminar</button></div></td></tr>`).join('')}</tbody></table></div><p class="muted">Duplicar conserva la fuente y vuelve a ejecutar el análisis; los casos manuales y capturas comienzan vacíos.</p>`:empty())}
function settings(){return pagehead('Configuración','Preferencias del workspace, almacenamiento y copias de seguridad.')+`<div class="two"><section class="panel"><h2>Workspace</h2><form id="settingsForm"><label class="field"><span>Nombre del tester</span><input name="tester" maxlength="200" value="${esc(state.settings.tester)}"></label><label class="field"><span>Nombre de producto predeterminado</span><input name="product" maxlength="300" value="${esc(state.settings.product)}"></label><label class="checkrow"><input type="checkbox" name="includeEvidence" ${state.settings.includeEvidence?'checked':''}>Incluir capturas en el reporte impreso</label><br><button class="primary" type="submit">Guardar configuración</button></form></section><section class="panel"><h2>Backup del workspace</h2><p>Incluye análisis, fuente HTML, issues, estados, casos manuales, configuración y capturas PNG/JPEG embebidas en JSON.</p><button data-action="export">EXPORT PULSO BACKUP</button><label class="field" style="margin-top:18px"><span>IMPORT PULSO BACKUP · JSON · hasta 80 MB</span><input id="backupFile" type="file" accept=".json,application/json"></label><p class="compact muted">La importación agrega análisis y restaura la configuración. Los IDs repetidos se conservan como copias; no se borran los análisis actuales.</p></section></div><section class="panel"><h2>Almacenamiento y alcance</h2><dl><dt>Motor local</dt><dd>${esc(PersistenceManager.mode)}</dd><dt>Privacidad</dt><dd>Sin subidas, telemetría ni peticiones de red. No se ejecuta el HTML analizado.</dd><dt>Persistencia</dt><dd>El navegador administra los datos. Cambiar de navegador, mover index.html, modo privado o borrar datos del sitio puede cambiar o eliminar el acceso. Exportá backups periódicamente.</dd><dt>Capacidad</dt><dd>La cuota depende del navegador. Si se agota, PULSO conserva los datos en memoria y avisa que no pudo guardarlos. Límite de carga: HTML 8 MB; captura 6 MB; backup importado 80 MB.</dd><dt>Fases siguientes</dt><dd>Motor extensible por módulos. Runtime aislado, consola, workflows, regresión, capturas automáticas y PDF interactivo todavía no implementados.</dd></dl></section>`}
function render(){const main=$('#main');$('#nav').innerHTML=navItems.map(([id,label],i)=>`<button data-nav="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><small>${String(i+1).padStart(2,'0')}</small>${label}</button>`).join('');$('#breadcrumb').textContent='Workspace / '+navItems.find(([id])=>id===view)[1]+(active()?' / '+active().file.name:'');main.innerHTML=({dashboard,new:newTest,runner:()=>runner(false),issues,evidence,cases:()=>runner(true),report,history,settings}[view])();}
function navigate(v){if(!navItems.some(([id])=>id===v))return;view=v;render();window.scrollTo(0,0)}
function modal(title,body){const el=$('#modal');el.innerHTML=`<div class="modalhead"><h2 id="modalTitle">${esc(title)}</h2><button data-action="closeModal" aria-label="Cerrar detalle">Cerrar ×</button></div><div class="modalbody">${body}</div>`;if(!el.open)el.showModal()}
function showIssue(id){const r=active(),i=r?.issues.find(x=>x.id===id);if(!i)return;modal(i.id+' · '+i.title,`<div class="actions">${badge(i.severity)} ${badge(i.mode)} ${badge(i.category)}</div><p>${esc(i.description)}</p><dl><dt>BUG ID</dt><dd>${esc(i.id)}</dd><dt>Ubicación aproximada</dt><dd>${esc(i.location)}</dd><dt>Elemento</dt><dd><pre>${esc(i.element||'Documento / revisión global')}</pre></dd><dt>EXPECTED</dt><dd>${esc(i.expected)}</dd><dt>ACTUAL</dt><dd>${esc(i.actual)}</dd><dt>EVIDENCE</dt><dd><pre>${esc(i.evidence)}</pre></dd><dt>RECOMMENDATION</dt><dd>${esc(i.recommendation)}</dd></dl><div class="two" style="margin-top:18px"><label class="field"><span>Estado</span><select data-issue-status="${esc(i.id)}">${options(issueStatuses,i.status)}</select></label><label class="field"><span>Severidad (criterio del tester)</span><select data-issue-severity="${esc(i.id)}">${options(severities,i.severity)}</select></label></div><p class="compact muted">El estado del issue no cambia el resultado original de la comprobación. Volvé a analizar el archivo corregido para obtener un resultado nuevo.</p><h3>Evidencias asociadas</h3>${evidenceCards(r,r.evidence.filter(e=>e.bugId===i.id))||'<p class="muted">Sin capturas asociadas.</p>'}<button data-action="issueEvidence" data-id="${esc(i.id)}">Agregar captura a este bug</button>`)}
async function loadHTML(file){if(!file)return;if(!/\.html?$/i.test(file.name))throw Error('Seleccioná un archivo .html o .htm.');if(file.size>MAX_HTML)throw Error('El HTML supera el límite de 8 MB.');if(!file.size)throw Error('El archivo está vacío.');const raw=await file.arrayBuffer();const head=new TextDecoder('windows-1252').decode(raw.slice(0,2048));const declared=head.match(/charset\s*=\s*["']?([a-z0-9_-]+)/i)?.[1];let encoding=declared||'utf-8';const a=new Uint8Array(raw);if(a[0]===255&&a[1]===254)encoding='utf-16le';else if(a[0]===254&&a[1]===255)encoding='utf-16be';else if(a[0]===239&&a[1]===187&&a[2]===191)encoding='utf-8';let source;try{source=new TextDecoder(encoding,{fatal:true}).decode(raw)}catch(_){throw Error('No se pudo decodificar el HTML ('+encoding+'). Guardalo como UTF-8 o corregí charset.')}const ctx=HTMLParser.parse(source);staged={file:{name:file.name,size:file.size,type:file.type},source,product:$('#productName')?.value||'',preview:{elements:ctx.all.length,scripts:ctx.q('script').length,styles:ctx.q('style,link[rel~="stylesheet"]').length,external:ctx.dependencies.filter(d=>d.scope==='Externa').length}};render();notify('HTML cargado en modo inerte; listo para analizar.')}
async function analyze(){if(!staged||busy)return;busy=true;const product=$('#productName')?.value.trim()||staged.product;render();await new Promise(r=>setTimeout(r,30));try{const run=TestEngine.run(staged.file,staged.source,product);state.runs.unshift(run);state.activeId=run.id;staged=null;await PersistenceManager.save();navigate('dashboard');notify(`Análisis completado: ${run.issues.length} hallazgos reales del archivo.`)}finally{busy=false;if(view==='new')render()}}
function demo(){const source='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Demo explícita · Planner</title><style>main{width:1100px}button{height:24px}</style></head><body><h1>Planner de demostración</h1><a href="#reports">Reportes</a><button onclick="savePlan()">Guardar</button><form><label for="missing">Nombre</label><input id="name" required><input type="number" min="10" max="2"><button>Enviar</button></form><img src="assets/logo.png"><script>function savePlan(){localStorage.setItem("plan", "demo")}<\/script></body></html>';const run=TestEngine.run({name:'DEMO-planner.html',size:new Blob([source]).size,type:'text/html'},source,'DEMO · Planner con defectos intencionales');state.runs.unshift(run);state.activeId=run.id;PersistenceManager.save();navigate('dashboard');notify('Demo analizada: los hallazgos provienen de su HTML de ejemplo.')}
document.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}const action=b.dataset.action,id=b.dataset.id,r=active();try{switch(action){case'closeModal':$('#modal').close();break;case'demo':demo();break;case'analyze':await analyze();break;case'issue':showIssue(id);break;case'resetFilters':filters={severity:'',category:'',status:'',mode:'',search:''};render();break;case'caseBug':{const c=r.cases.find(x=>x.id===id);const issue=ManualTestManager.bug(r,c);if(issue){await PersistenceManager.save();render();showIssue(issue.id)}break}case'caseEvidence':case'issueEvidence':$('#modal').close();navigate('evidence');if(action==='caseEvidence'){$('#evidenceCase').value=id;$('#evidenceBug').value=r.cases.find(c=>c.id===id)?.bugId||''}else $('#evidenceBug').value=id;$('#imageInput').focus();break;case'viewEvidence':{const e=r.evidence.find(x=>x.id===id);modal(e.description||e.name,`<img class="fullimage" src="${esc(e.data)}" alt="${esc(e.description)}"><p>${esc(e.notes)}</p><p class="muted">${esc(date(e.date))}</p><button data-action="downloadEvidence" data-id="${esc(id)}">Descargar captura</button>`);break}case'downloadEvidence':{const e=r.evidence.find(x=>x.id===id);const a=document.createElement('a');a.href=e.data;a.download=e.name;a.click();break}case'deleteEvidence':if(confirm('¿Eliminar esta captura del análisis?')){r.evidence=r.evidence.filter(e=>e.id!==id);await PersistenceManager.save();$('#modal').close();render()}break;case'openRun':state.activeId=id;await PersistenceManager.save();navigate('dashboard');break;case'duplicateRun':{const original=state.runs.find(x=>x.id===id);const copy=TestEngine.run(original.file,original.source,original.product+' · nuevo test');state.runs.unshift(copy);state.activeId=copy.id;await PersistenceManager.save();render();notify('Nuevo análisis creado; casos manuales sin ejecutar.');break}case'deleteRun':if(confirm('¿Eliminar este análisis y sus evidencias locales?')){state.runs=state.runs.filter(x=>x.id!==id);if(state.activeId===id)state.activeId=state.runs[0]?.id||null;await PersistenceManager.save();render()}break;case'export':BackupManager.export();break;case'print':await ReportManager.print();break}}catch(e){notify('No se pudo completar: '+e.message)}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='issueSearch'){filters.search=el.value;$('#issueResults').innerHTML=issueTable(active(),filteredIssues(active()))}if(el.dataset.caseNotes){const c=active().cases.find(x=>x.id===el.dataset.caseNotes);c.notes=el.value;PersistenceManager.save()}if(el.id==='productName'&&staged)staged.product=el.value});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='htmlFile')await loadHTML(el.files[0]);if(el.dataset.filter){filters[el.dataset.filter]=el.value;$('#issueResults').innerHTML=issueTable(active(),filteredIssues(active()))}if(el.dataset.caseResult){const id=el.dataset.caseResult;active().cases.find(c=>c.id===id).result=el.value;await PersistenceManager.save();render();document.getElementById('case-'+id).open=true}if(el.dataset.issueStatus||el.dataset.issueSeverity){const id=el.dataset.issueStatus||el.dataset.issueSeverity;const i=active().issues.find(i=>i.id===id);i[el.dataset.issueStatus?'status':'severity']=el.value;await PersistenceManager.save();render()}if(el.id==='backupFile'){await BackupManager.import(el.files[0]);el.value=''}if(el.id==='imageInput'){const data=await EvidenceManager.read(el.files[0]);$('#imagePreview').src=data;$('#imagePreview').hidden=false}}catch(error){if(el.id==='imageInput'){$('#imagePreview').hidden=true;el.value=''}notify(error.message)}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{if(form.id==='settingsForm'){const data=new FormData(form);state.settings={tester:String(data.get('tester')).trim(),product:String(data.get('product')).trim(),includeEvidence:data.has('includeEvidence')};await PersistenceManager.save();notify('Configuración guardada.')}if(form.id==='evidenceForm'){const button=form.querySelector('button[type=submit]');button.disabled=true;try{const r=active(),data=new FormData(form),file=data.get('image');const image=await EvidenceManager.read(file);r.evidence.push({id:uid(),name:file.name,description:String(data.get('description')).trim(),notes:String(data.get('notes')).trim(),bugId:data.get('bugId')||null,caseId:data.get('caseId')||null,date:new Date().toISOString(),data:image});await PersistenceManager.save();render();notify('Evidencia guardada localmente.')}finally{button.disabled=false}}}catch(error){notify(error.message)}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('drag')}});document.addEventListener('dragleave',e=>{if(e.target.closest('#drop'))$('#drop').classList.remove('drag')});document.addEventListener('drop',async e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.remove('drag');try{if(e.dataTransfer.files.length!==1)throw Error('Cargá un solo archivo HTML por análisis.');await loadHTML(e.dataTransfer.files[0])}catch(error){notify(error.message)}}});
window.addEventListener('beforeprint',()=>{if(active())$('#printRoot').innerHTML=ReportManager.html(active())});
window.addEventListener('afterprint',()=>$('#printRoot').innerHTML='');
window.addEventListener('error',e=>notify('Error de aplicación: '+e.message));
window.addEventListener('unhandledrejection',e=>notify('Operación incompleta: '+(e.reason?.message||e.reason)));
PersistenceManager.init().then(render);
const _runnerOriginal=runner;
const _metricsOriginal=metrics;
metrics=function(run){const m=_metricsOriginal(run);if(!run)return m;const confirmed=run.issues.filter(i=>['RUNTIME','MANUAL'].includes(i.mode)&&i.checkStatus==='FAIL'&&i.status!=='Fixed'&&i.status!=="Won't Fix").length;const staticConditions=run.issues.filter(i=>i.mode==='STATIC').length;const runtimeErrors=run.issues.filter(i=>i.mode==='RUNTIME').length;const manualFails=run.cases.filter(c=>c.result==='FAIL').length;return {...m,staticConditions,runtimeErrors,confirmedFailures:confirmed+manualFails,functionalStatus:confirmed+manualFails?'FUNCTIONAL FAIL':run.runtime?.status==='PASSED'?'NO CONFIRMED FAILURE':'NOT FULLY TESTED',status:confirmed+manualFails?'FUNCTIONAL FAIL':staticConditions?'STATIC REVIEW · CONDITIONS DETECTED':run.runtime?.status==='PASSED'?'PASS':'NOT FULLY TESTED'}};
function runtimePanel(r){const x=r.runtime||{status:'NOT RUN',inventory:null,interactions:[],errors:[],warnings:[],environment:'Sandbox pendiente'};return `<section class="panel"><div class="pagehead"><div><div class="eyebrow">RUNTIME TEST · AISLADO</div><h2>Runtime Tester</h2><p class="muted">iframe sandbox allow-scripts · sin allow-same-origin · sin navegación superior</p></div><div class="actions"><button class="primary" data-action="runtimeRun">RUN RUNTIME TEST</button><button data-action="runtimePause">PAUSE / RESUME</button><button data-action="runtimeStop">STOP TEST</button><button data-action="runtimeReset">RESET TEST ENVIRONMENT</button></div></div><div class="two"><div><div class="kvs"><span><strong>${esc(x.status||'NOT RUN')}</strong>Runtime status</span><span><strong>${x.inventory?.count||0}</strong>Interactive Elements</span><span><strong>${x.interactions?.length||0}</strong>Interactions Tested</span><span><strong>${x.errors?.length||0}</strong>Runtime Errors</span></div><div class="note">${esc(x.environment||'Sandbox pendiente')}<br>Safe actions only. Dangerous actions are never auto-run.</div><h3>Test Timeline</h3><div class="tablewrap"><table><thead><tr><th>Timestamp</th><th>Action</th><th>Result</th></tr></thead><tbody>${(x.interactions||[]).map(i=>`<tr><td>${esc(date(i.timestamp))}</td><td><code>${esc(i.selector||i.action||'')}</code></td><td>${badge(i.result,i.result==='RUNTIME ERROR'?'FAIL':i.result==='REACTION DETECTED'?'PASS':'NV')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">NOT RUN · no se ejecutó ninguna acción.</td></tr>'}</tbody></table></div></div><div><h3>LIVE TEST VIEW</h3><iframe id="runtimeFrame" title="Producto bajo prueba aislada" sandbox="allow-scripts" style="width:100%;height:330px;border:1px solid var(--line);background:white"></iframe><h3>Console Errors / Warnings</h3><pre>${esc([...(x.errors||[]).map(e=>'ERROR: '+e.message),...(x.warnings||[]).map(e=>'WARN: '+e.message)].join('\n')||'Sin mensajes capturados.')}</pre></div></div></section>`}
runner=function(catalog=false){const html=_runnerOriginal(catalog);return catalog||!active()?html:html.replace('<section class="panel"><h2>Manual Test Runner</h2>',runtimePanel(active())+'<section class="panel"><h2>Manual Test Runner</h2>')};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const r=active();try{if(b.dataset.action==='runtimeRun'&&r){const log=(a,d)=>{if(r.runtime){r.runtime.lastAction=a;r.runtime.lastDetail=d}};RuntimeTester.run(r,{speed:state.settings.runtimeSpeed||'normal'},log).then(()=>{PersistenceManager.save();render();notify('RUNTIME TEST COMPLETE · las acciones peligrosas fueron omitidas.')});}else if(b.dataset.action==='runtimePause'&&RuntimeTester.active){RuntimeTester.active.paused=!RuntimeTester.active.paused;notify(RuntimeTester.active.paused?'Runtime pausado':'Runtime reanudado')}else if(b.dataset.action==='runtimeStop'&&RuntimeTester.active){RuntimeTester.active.stop=true;notify('TEST STOPPED BY USER')}else if(b.dataset.action==='runtimeReset'){if(RuntimeTester.active)RuntimeTester.active.stop=true;if(r){r.runtime=null;await PersistenceManager.save();render();notify('Sandbox reiniciado; resultados previos de runtime descartados.')}}}catch(err){notify('Runtime: '+err.message)}});
</script>
